<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>뒤풀이 정산</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

html,body{margin:0}
body{background:#131109}

html{scrollbar-width:thin;scrollbar-color:rgba(203,171,108,.35) #151109}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#151109}
::-webkit-scrollbar-thumb{background:rgba(203,171,108,.28);border-radius:20px;border:3px solid #151109}
::-webkit-scrollbar-thumb:hover{background:rgba(203,171,108,.5)}

*{box-sizing:border-box}
.wrap{
  --ink:#131109; --panel:#1b1810; --panel2:#231f16; --raise:#2a2519;
  --hair:rgba(203,171,108,.16); --hair-2:rgba(203,171,108,.30);
  --gold:#cbab6c; --gold-dim:#a98d57;
  --clay:#c06a52; --clay-dim:#a9573f;
  --sage:#93a08f;
  --ivory:#ece3d0; --ivory-ink:#2b2417; --ivory-line:#cabd9c; --ivory-mut:#9c8d6c;
  --tx:#f0eadb; --mut:#a89a80; --mut2:#6d6350;
  --serif:'Noto Serif KR',serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  font-family:var(--sans);
  background:
    radial-gradient(130% 90% at 82% -12%, #2b2416 0%, rgba(43,36,22,0) 52%),
    radial-gradient(120% 120% at 0% 110%, #1c1810 0%, rgba(28,24,16,0) 45%),
    var(--ink);
  color:var(--tx); min-height:100vh; padding:34px 20px 52px; line-height:1.55;
  -webkit-font-smoothing:antialiased; letter-spacing:.005em;
}
.frame{max-width:1060px;margin:0 auto}

.top{display:flex;gap:24px;justify-content:space-between;align-items:flex-end;
  flex-wrap:wrap;padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid var(--hair)}
.eyebrow{font-size:12px;letter-spacing:.42em;color:var(--gold);font-weight:600}
.brand h1{font-family:var(--serif);margin:12px 0 10px;font-size:38px;font-weight:600;
  letter-spacing:.02em;color:#f6f0e2;line-height:1}
.sub{margin:0;max-width:50ch;color:var(--mut);font-size:14px;line-height:1.65}
.sub b{color:var(--clay);font-weight:600} .sub b.hl{color:var(--gold)}
.sync{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:12px;
  color:var(--mut);border:1px solid var(--hair);border-radius:20px;padding:5px 12px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--mut2);transition:.2s}
.sync.on{color:var(--tx)}
.sync.on .sdot{background:#6fbf73;box-shadow:0 0 0 3px rgba(111,191,115,.16)}

.stats{display:flex;border:1px solid var(--hair);border-radius:13px;
  overflow:hidden;background:linear-gradient(180deg,var(--panel),#181509)}
.stat{padding:13px 22px;text-align:center;display:flex;flex-direction:column;gap:2px;
  border-right:1px solid var(--hair);min-width:82px}
.stat:last-child{border-right:0}
.stat .num{font-family:var(--serif);font-size:29px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1;color:#efe7d5}
.stat .lab{font-size:11.5px;color:var(--mut);letter-spacing:.06em;white-space:nowrap}
.stat.gold .num{color:var(--gold)} .stat.clay .num{color:var(--clay)}

.segmented{display:none;background:var(--panel);border:1px solid var(--hair);
  border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.segmented button{flex:1;padding:11px;border:0;background:transparent;color:var(--mut);
  font-size:14px;font-weight:600;border-radius:9px;cursor:pointer;font-family:inherit}
.segmented button.on{background:var(--raise);color:var(--tx)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}

.card{background:linear-gradient(180deg,var(--panel),#17140c);
  border:1px solid var(--hair);border-radius:15px;padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h2{font-family:var(--serif);margin:0;font-size:16px;font-weight:600;
  letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.tick{width:3px;height:15px;border-radius:2px;background:var(--mut2);flex:none}
.tick.gold{background:var(--gold)} .tick.sage{background:var(--sage)}
.count{font-family:var(--serif);font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;
  min-width:26px;text-align:center}
.hint{margin:0 0 11px;font-size:12.5px;color:var(--mut);line-height:1.6}

.paid-card{border-color:var(--hair-2)}
.paid-card .card-head h2{color:var(--gold)}

.add-input{width:100%;background:#100e07;border:1px solid var(--hair);border-radius:10px;
  color:var(--tx);font-family:inherit;font-size:15px;padding:11px 13px;outline:none;
  transition:border-color .15s;display:block}
.add-input:focus{border-color:var(--gold-dim)}
.add-input::placeholder{color:var(--mut2)}

.nchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.nchips:empty{display:none}
.nchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--hair);border-radius:20px;padding:5px 6px 5px 12px;font-size:13.5px;color:var(--tx)}
.nchip .x{border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:13px;
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  line-height:1;padding:0;font-family:inherit;transition:.12s}
.nchip .x:hover{background:rgba(192,106,82,.22);color:#e8917a}
.list-actions{flex-basis:100%;display:flex;justify-content:flex-end;margin-top:9px}
.list-actions button{background:transparent;border:1px solid var(--hair);color:var(--mut);
  font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;cursor:pointer;
  font-family:inherit;transition:.12s}
.list-actions button:hover{color:var(--gold);border-color:var(--hair-2)}

.rounds{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.round-card{padding:14px}
.round-card.primary{border-color:var(--hair-2)}
.round-card.primary .card-head h2{color:var(--gold)}
.badge-fee{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;
  color:var(--gold);background:rgba(203,171,108,.12);border:1px solid var(--hair-2);
  border-radius:20px;padding:2px 8px}
.round-card .add-input{font-size:14px;padding:9px 12px}
.round-card .nchip{font-size:13px;padding:4px 5px 4px 11px}

.toolbar{display:flex;gap:9px}
.ghost{flex:1;background:transparent;border:1px solid var(--hair);color:var(--mut);
  padding:11px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s}
.ghost:hover{color:var(--clay);border-color:rgba(192,106,82,.4)}

/* 청구서 */
.bill{background:linear-gradient(180deg,#f1e9d8,var(--ivory));
  color:var(--ivory-ink);border-radius:9px;padding:26px 24px 24px;position:relative;
  box-shadow:0 24px 55px -26px rgba(0,0,0,.72),0 2px 0 rgba(255,255,255,.25) inset}
.b-rule{position:absolute;top:0;left:24px;right:24px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.b-head{text-align:center;padding:6px 0 14px;margin-bottom:14px;
  border-bottom:1px solid var(--ivory-line);position:relative}
.b-head::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--ivory-line)}
.b-title{font-family:var(--serif);display:block;font-size:22px;font-weight:600;letter-spacing:.04em}
.b-sub{font-size:10.5px;letter-spacing:.26em;color:var(--ivory-mut)}
.b-empty{font-family:var(--serif);text-align:center;color:var(--ivory-mut);
  padding:34px 10px;font-size:15px;line-height:1.9}
.b-empty.done{color:#5c7a3e}
.warn{background:#f6e6c4;border:1px solid #ddc189;color:#7a5a1e;border-radius:8px;
  padding:10px 12px;font-size:12px;margin-bottom:14px;line-height:1.55}
.b-list{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column}
.b-list li{counter-increment:n;display:flex;align-items:baseline;gap:12px;
  padding:9px 2px;border-bottom:1px dotted var(--ivory-line)}
.b-list li::before{content:counter(n,decimal-leading-zero);color:#bcac86;
  font-size:12px;font-variant-numeric:tabular-nums;min-width:22px;letter-spacing:.05em}
.b-list .nm{font-family:var(--serif);font-size:17px;font-weight:600;flex:1;letter-spacing:.01em}
.b-list .rt{font-size:11px;color:#8c7d5b;border:1px solid var(--ivory-line);
  border-radius:20px;padding:2px 9px;letter-spacing:.02em}
.b-foot{display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--ivory-ink);margin-top:14px;padding-top:12px;
  font-size:13px;font-weight:700;color:#4a3f28;letter-spacing:.02em}
.b-foot .amt{font-family:var(--serif);font-size:19px;font-weight:700}
.b-copy{width:100%;margin-top:16px;background:transparent;color:var(--ivory-ink);
  border:1px solid var(--ivory-ink);padding:13px;border-radius:8px;font-size:13.5px;
  font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em;transition:.15s}
.b-copy:hover{background:var(--ivory-ink);color:var(--ivory)}

/* 별도 카드 */
.noshow-card{border-color:var(--hair-2)}
.noshow-card .card-head h2{color:var(--gold)}
.refund-card .card-head h2{color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--hair);border-radius:20px;
  padding:6px 13px;font-size:13px;color:var(--tx)}
.chip em{font-style:normal;color:var(--mut);font-size:11px;margin-left:5px}

/* 참석자 표 */
.legend{display:flex;gap:16px;margin-bottom:10px;font-size:11.5px;color:var(--mut);
  padding-bottom:10px;border-bottom:1px solid var(--hair)}
.legend span{display:flex;align-items:center;gap:6px}
.d{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d.paid{background:var(--gold)} .d.unpaid{background:var(--clay)} .d.exempt{background:var(--sage)}
.table-card .card-head .count{background:var(--panel2);border:1px solid var(--hair);
  border-radius:20px;padding:1px 9px;font-size:12px}
.sort-toggle{display:inline-flex;background:var(--panel2);border:1px solid var(--hair);
  border-radius:9px;padding:3px;flex:none}
.sort-toggle button{border:0;background:transparent;color:var(--mut);font-size:12px;
  font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.15s}
.sort-toggle button.on{background:var(--raise);color:var(--gold)}
.groups{display:flex;flex-direction:column;gap:15px}
.group-head{display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 8px;border-bottom:1px solid var(--hair);margin-bottom:2px}
.gh-left{display:flex;align-items:center;gap:8px;font-family:var(--serif);
  font-size:13.5px;font-weight:600;letter-spacing:.03em;color:var(--tx)}
.gh-count{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.table{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:10px 4px 10px 11px;
  border-bottom:1px solid var(--hair);font-size:15px;border-left:2px solid transparent}
.row:last-child{border-bottom:0}
.row.paid{border-left-color:var(--gold)}
.row.unpaid{border-left-color:var(--clay)}
.row.exempt{border-left-color:var(--sage)}
.t-name{flex:1;font-weight:600}
.row.exempt .t-name{color:var(--mut);font-weight:500}
.t-rounds{font-size:11.5px;color:var(--mut);letter-spacing:.02em}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:20px;
  padding:3px 11px;min-width:44px;text-align:center}
.row.paid .pill{color:var(--gold);background:rgba(203,171,108,.11);border:1px solid var(--hair-2)}
.row.unpaid .pill{color:#e08a72;background:rgba(192,106,82,.13);border:1px solid rgba(192,106,82,.32)}
.row.exempt .pill{color:var(--sage);background:rgba(147,160,143,.1);border:1px solid rgba(147,160,143,.24)}

.foot{margin:30px auto 0;text-align:center;color:var(--mut2);font-size:11.5px;
  letter-spacing:.01em;line-height:1.7;max-width:56ch}

@media (max-width:820px){
  .wrap{padding:24px 15px 36px}
  .brand h1{font-size:31px}
  .stats{width:100%} .stat{flex:1;min-width:0}
  .segmented{display:flex}
  .grid{grid-template-columns:1fr}
  .pane-input .col-result{display:none}
  .pane-result .col-input{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <header class="top">
      <div class="brand">
        <span class="eyebrow">뚜라미·TURAMI</span>
        <h1>뒤풀이 정산</h1>
        <p class="sub">참가비 15,000원은 <b class="hl">1차 참석자</b>에게만. 2차부터 온 사람은 면제.</p>
        <div class="sync" id="sync"><span class="sdot"></span><span id="sync-text">연결 중…</span></div>
      </div>
      <div class="stats">
        <div class="stat plain"><span class="num" id="st-target">0</span><span class="lab">1차 참석</span></div>
        <div class="stat gold"><span class="num" id="st-paid">0</span><span class="lab">납부</span></div>
        <div class="stat clay"><span class="num" id="st-unpaid">0</span><span class="lab">미납</span></div>
      </div>
    </header>

    <div class="segmented" role="tablist">
      <button id="tab-input" class="on">입력</button>
      <button id="tab-result">결과</button>
    </div>

    <main class="grid pane-input" id="main">
      <section class="col col-input">
        <div class="card paid-card">
          <div class="card-head"><h2><i class="tick gold"></i>15,000원 낸 사람</h2><span class="count" id="cnt-paid">0</span></div>
          <p class="hint">이름을 입력하고 Enter. 여러 명은 붙여넣기하면 한 번에 추가돼요.</p>
          <input class="add-input" id="add-paid" placeholder="이름 입력 후 Enter" spellcheck="false" autocomplete="off" />
          <div class="nchips" id="chips-paid"></div>
        </div>

        <div class="rounds">
          <div class="card round-card primary">
            <div class="card-head"><h2>1차 <span class="badge-fee">납부 대상</span></h2><span class="count" id="cnt-r1">0</span></div>
            <input class="add-input" id="add-r1" placeholder="참석자" spellcheck="false" autocomplete="off" />
            <div class="nchips" id="chips-r1"></div>
          </div>
          <div class="card round-card">
            <div class="card-head"><h2>2차</h2><span class="count" id="cnt-r2">0</span></div>
            <input class="add-input" id="add-r2" placeholder="참석자" spellcheck="false" autocomplete="off" />
            <div class="nchips" id="chips-r2"></div>
          </div>
          <div class="card round-card">
            <div class="card-head"><h2>3차</h2><span class="count" id="cnt-r3">0</span></div>
            <input class="add-input" id="add-r3" placeholder="참석자" spellcheck="false" autocomplete="off" />
            <div class="nchips" id="chips-r3"></div>
          </div>
          <div class="card round-card">
            <div class="card-head"><h2>4차</h2><span class="count" id="cnt-r4">0</span></div>
            <input class="add-input" id="add-r4" placeholder="참석자" spellcheck="false" autocomplete="off" />
            <div class="nchips" id="chips-r4"></div>
          </div>
        </div>

        <div class="toolbar">
          <button class="ghost" id="btn-clear">전부 비우기 (공유)</button>
        </div>
      </section>

      <section class="col col-result" id="result"></section>
    </main>

    <footer class="foot">입력한 이름은 공유 데이터베이스(Firebase)에 저장되어, 같은 주소를 연 사람과 실시간으로 함께 편집됩니다. 이 주소는 관리자끼리만 공유하세요.</footer>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, onValue, push, remove, set } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEStpLLCJaPQx9pr58X1c-m4eFBtvLMh0",
  authDomain: "turami2026-payment.firebaseapp.com",
  databaseURL: "https://turami2026-payment-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "turami2026-payment",
  storageBucket: "turami2026-payment.firebasestorage.app",
  messagingSenderId: "883479369002",
  appId: "1:883479369002:web:c7451ac4c3a57b2115ba53"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── 회식 정산: 1차 참석자 중 안 낸 사람 찾기 (실시간 공동편집) ──────────
var FEE = 15000;
var LIST_KEYS = ["paid", "r1", "r2", "r3", "r4"];
var ROUND_KEYS = ["r1", "r2", "r3", "r4"];
var data = { paid: {}, r1: {}, r2: {}, r3: {}, r4: {} };
var view = { sortMode: "name" };
var copied = false, copyTimer = null;

function parseNames(t) {
  return (t || "").split(/[\n,]/).map(function (s) { return s.trim(); }).filter(Boolean);
}
// 매칭 키: 괄호 주석((선배),[선],（선） 등)과 공백 제거 (표시는 원본 유지)
function norm(s) {
  return s.replace(/\([^)]*\)/g, "").replace(/（[^）]*）/g, "").replace(/\[[^\]]*\]/g, "").replace(/\s+/g, "");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function roundTag(rs) { return rs.join("·") + "차"; }
var STATE_LABEL = { paid: "납부", unpaid: "미납", exempt: "면제" };

function itemsOf(key) {
  var obj = data[key] || {};
  return Object.keys(obj).map(function (id) { return { id: id, name: obj[id] }; })
    .sort(function (a, b) { return a.name.localeCompare(b.name, "ko"); });
}
function namesOf(key) { return itemsOf(key).map(function (x) { return x.name; }); }

function compute() {
  var paidNames = namesOf("paid");
  var paidSet = new Set(paidNames.map(norm));

  var map = new Map();
  ROUND_KEYS.forEach(function (rk, idx) {
    namesOf(rk).forEach(function (name) {
      var k = norm(name);
      if (!k) return;
      if (!map.has(k)) map.set(k, { name: name, rounds: new Set() });
      map.get(k).rounds.add(idx + 1);
    });
  });

  var attendees = Array.from(map.entries()).map(function (e) {
    var k = e[0], v = e[1];
    var rs = Array.from(v.rounds).sort(function (a, b) { return a - b; });
    var owes = rs.indexOf(1) !== -1;
    var paid = paidSet.has(k);
    var st = !owes ? "exempt" : (paid ? "paid" : "unpaid");
    return { key: k, name: v.name, rounds: rs, owes: owes, paid: paid, state: st };
  }).sort(function (a, b) { return a.name.localeCompare(b.name, "ko"); });

  var target = attendees.filter(function (a) { return a.owes; });
  var unpaid = attendees.filter(function (a) { return a.state === "unpaid"; });
  var paidOk = attendees.filter(function (a) { return a.state === "paid"; });
  var exempt = attendees.filter(function (a) { return a.state === "exempt"; });

  var attendedKeys = new Set(map.keys());
  var seen = new Set();
  var paidNoShow = [];
  paidNames.forEach(function (n) {
    var k = norm(n);
    if (!k || attendedKeys.has(k) || seen.has(k)) return;
    seen.add(k);
    paidNoShow.push(n);
  });
  paidNoShow.sort(function (a, b) { return a.localeCompare(b, "ko"); });

  var exemptPaid = exempt.filter(function (a) { return a.paid; });

  return { attendees: attendees, target: target, unpaid: unpaid, paidOk: paidOk,
    exempt: exempt, exemptPaid: exemptPaid, paidNoShow: paidNoShow, hasPaid: paidNames.length > 0 };
}

function rowHTML(a) {
  return '<li class="row ' + a.state + '"><span class="t-name">' + esc(a.name) +
    '</span><span class="t-rounds">' + roundTag(a.rounds) +
    '</span><span class="pill">' + STATE_LABEL[a.state] + '</span></li>';
}

function resultHTML(R) {
  var bill;
  if (!R.target.length) {
    bill = '<div class="b-empty">1차 참석자를 입력하면<br>여기에 미납 명단이 나옵니다.</div>';
  } else if (!R.unpaid.length) {
    bill = '<div class="b-empty done">1차 참석자 전원 납부 완료</div>';
  } else {
    var warn = R.hasPaid ? "" :
      '<div class="warn">입금 명단이 비어 있어 지금은 1차 참석자 전원이 미납으로 잡힙니다. 입금자 이름을 넣으면 걸러져요.</div>';
    var items = R.unpaid.map(function (a) {
      return '<li><span class="nm">' + esc(a.name) + '</span><span class="rt">' + roundTag(a.rounds) + '</span></li>';
    }).join("");
    bill = warn + '<ol class="b-list">' + items + '</ol>' +
      '<div class="b-foot"><span>합계 ' + R.unpaid.length + '명</span>' +
      '<span class="amt">' + (R.unpaid.length * FEE).toLocaleString() + '원</span></div>' +
      '<button class="b-copy" data-action="copy">' + (copied ? "복사되었습니다" : "명단 복사") + '</button>';
  }
  var html = '<div class="bill"><div class="b-rule"></div>' +
    '<div class="b-head"><span class="b-title">미납 명단</span>' +
    '<span class="b-sub">1차 참석 · 미입금 · 가나다순</span></div>' + bill + '</div>';

  if (R.paidNoShow.length) {
    var chips1 = R.paidNoShow.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join("");
    html += '<div class="card noshow-card"><div class="card-head">' +
      '<h2><i class="tick gold"></i>입금 · 미참석</h2><span class="count">' + R.paidNoShow.length + '명</span></div>' +
      '<p class="hint">입금은 했는데 어느 차수에도 참석 명단에 없어요. 회식에 안 왔거나, 계좌명이 달라서(예: 부모님 계좌) 이름이 안 맞는 경우예요.</p>' +
      '<div class="chips">' + chips1 + '</div></div>';
  }
  if (R.exemptPaid.length) {
    var chips2 = R.exemptPaid.map(function (a) {
      return '<span class="chip">' + esc(a.name) + '<em>' + roundTag(a.rounds) + '</em></span>';
    }).join("");
    html += '<div class="card refund-card"><div class="card-head">' +
      '<h2><i class="tick sage"></i>환불 확인</h2><span class="count">' + R.exemptPaid.length + '명</span></div>' +
      '<p class="hint">1차에 안 와서 면제 대상인데 15,000원을 냈어요. 환불 여부를 확인하세요.</p>' +
      '<div class="chips">' + chips2 + '</div></div>';
  }
  if (R.attendees.length) {
    var body;
    if (view.sortMode === "name") {
      body = '<div class="legend">' +
        '<span><i class="d paid"></i>납부</span>' +
        '<span><i class="d unpaid"></i>미납</span>' +
        '<span><i class="d exempt"></i>면제 (2차~)</span></div>' +
        '<ul class="table">' + R.attendees.map(rowHTML).join("") + '</ul>';
    } else {
      var groups = [
        { key: "unpaid", label: "미납", items: R.unpaid },
        { key: "paid", label: "납부", items: R.paidOk },
        { key: "exempt", label: "면제", items: R.exempt }
      ];
      body = '<div class="groups">' + groups.map(function (g) {
        if (!g.items.length) return "";
        return '<div class="group"><div class="group-head">' +
          '<span class="gh-left"><i class="d ' + g.key + '"></i>' + g.label + '</span>' +
          '<span class="gh-count">' + g.items.length + '명</span></div>' +
          '<ul class="table">' + g.items.map(rowHTML).join("") + '</ul></div>';
      }).join("") + '</div>';
    }
    html += '<div class="card table-card"><div class="card-head">' +
      '<h2><i class="tick"></i>참석자 전체 <span class="count">' + R.attendees.length + '명</span></h2>' +
      '<div class="sort-toggle">' +
      '<button class="' + (view.sortMode === "name" ? "on" : "") + '" data-action="sort" data-sort="name">가나다순</button>' +
      '<button class="' + (view.sortMode === "group" ? "on" : "") + '" data-action="sort" data-sort="group">상태별</button>' +
      '</div></div>' + body + '</div>';
  }
  return html;
}

function $(id) { return document.getElementById(id); }

function chipHTML(key, it) {
  return '<span class="nchip">' + esc(it.name) +
    '<button class="x" data-action="del" data-key="' + key + '" data-id="' + it.id + '" aria-label="삭제">✕</button></span>';
}

function renderChips() {
  LIST_KEYS.forEach(function (key) {
    var items = itemsOf(key);
    $("cnt-" + key).textContent = items.length + "명";
    var chips = items.map(function (it) { return chipHTML(key, it); }).join("");
    var actions = items.length ? '<div class="list-actions"><button data-action="copylist" data-key="' + key + '">목록 복사</button></div>' : "";
    $("chips-" + key).innerHTML = chips + actions;
  });
}

function render() {
  var R = compute();
  $("st-target").textContent = R.target.length;
  $("st-paid").textContent = R.paidOk.length;
  $("st-unpaid").textContent = R.unpaid.length;
  renderChips();
  $("tab-result").textContent = R.unpaid.length ? ("결과 · 미납 " + R.unpaid.length) : "결과";
  $("result").innerHTML = resultHTML(R);
}

function setPane(p) {
  $("main").className = "grid pane-" + p;
  $("tab-input").classList.toggle("on", p === "input");
  $("tab-result").classList.toggle("on", p === "result");
}

function addNames(key, raw) {
  var existing = new Set(namesOf(key).map(function (s) { return s.trim(); }));
  parseNames(raw).forEach(function (n) {
    if (existing.has(n)) return;
    existing.add(n);
    push(ref(db, "lists/" + key), n);
  });
}

function copyList() {
  var R = compute();
  if (!R.unpaid.length) return;
  var lines = R.unpaid.map(function (a, i) { return (i + 1) + ". " + a.name + " (" + roundTag(a.rounds) + ")"; });
  var text = "[뚜라미 회식 미납] " + R.unpaid.length + "명 · " + (R.unpaid.length * FEE).toLocaleString() + "원\n" + lines.join("\n");
  var done = function () {
    copied = true; render();
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copied = false; render(); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

// ── 입력 연결 (이름 추가) ──
LIST_KEYS.forEach(function (key) {
  var inp = $("add-" + key);
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (inp.value.trim()) { addNames(key, inp.value); inp.value = ""; }
    }
  });
  inp.addEventListener("paste", function (e) {
    var t = (e.clipboardData || window.clipboardData).getData("text");
    if (/[\n,]/.test(t)) { e.preventDefault(); addNames(key, t); inp.value = ""; }
  });
});

// ── 삭제 (이름표 ✕) ──
document.addEventListener("click", function (e) {
  var del = e.target.closest('[data-action="del"]');
  if (del) { remove(ref(db, "lists/" + del.getAttribute("data-key") + "/" + del.getAttribute("data-id"))); return; }
  var cl = e.target.closest('[data-action="copylist"]');
  if (cl) {
    var key = cl.getAttribute("data-key");
    var names = itemsOf(key).map(function (x) { return x.name; });
    if (!names.length) return;
    var text = names.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
    var old = cl.textContent; cl.textContent = "복사됨";
    setTimeout(function () { cl.textContent = old; }, 1200);
  }
});

// ── 결과 영역 (복사 / 정렬) ──
$("result").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.getAttribute("data-action") === "copy") copyList();
  else if (el.getAttribute("data-action") === "sort") { view.sortMode = el.getAttribute("data-sort"); render(); }
});

// ── 탭 / 전부 비우기 ──
$("tab-input").addEventListener("click", function () { setPane("input"); });
$("tab-result").addEventListener("click", function () { setPane("result"); });
$("btn-clear").addEventListener("click", function () {
  if (confirm("공유된 명단 전체를 지웁니다. 함께 쓰는 사람 화면에서도 사라져요. 계속할까요?")) {
    set(ref(db, "lists"), null);
  }
});

// ── 실시간 구독 ──
onValue(ref(db, "lists"), function (snap) {
  var v = snap.val() || {};
  data = { paid: v.paid || {}, r1: v.r1 || {}, r2: v.r2 || {}, r3: v.r3 || {}, r4: v.r4 || {} };
  render();
});
onValue(ref(db, ".info/connected"), function (snap) {
  var on = snap.val() === true;
  $("sync").classList.toggle("on", on);
  $("sync-text").textContent = on ? "실시간 연결됨" : "연결 중…";
});

render();
</script>
</body>
</html>
